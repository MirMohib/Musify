name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Expo Prebuild (Android)
        run: npx expo prebuild --platform android --clean

      - name: Build Signed Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify and Package APK
        working-directory: android
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -maxdepth 2 -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Built APK not found in app/build/outputs/apk/release!"
            find app/build/outputs/apk -maxdepth 4 || true
            exit 1
          fi

          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDK_DIR/build-tools" -name "apksigner" 2>/dev/null | sort -V | tail -n 1 || true)
          if echo "$APK_PATH" | grep -q "unsigned" && [ -n "$APKSIGNER" ]; then
            KEYSTORE="app/debug.keystore"
            if [ ! -f "$KEYSTORE" ]; then
              keytool -genkeypair -v -storetype PKCS12 -keystore "$KEYSTORE" \
                -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            SIGNED_OUT="app/build/outputs/apk/release/Musify.apk"
            "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias androiddebugkey \
              --ks-pass pass:android --key-pass pass:android \
              --out "$SIGNED_OUT" "$APK_PATH"
            APK_PATH="$SIGNED_OUT"
          fi

          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify "$APK_PATH"
          fi

          mkdir -p dist
          cp "$APK_PATH" dist/Musify.apk
          ls -lh dist/Musify.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Musify-Android-APK
          path: android/dist/Musify.apk
