name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE_26=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode-26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_26" ]; then
            sudo xcode-select -s "$XCODE_26/Contents/Developer"
          else
            LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Expo Prebuild (iOS)
        run: npx expo prebuild --platform ios --clean

      - name: Patch Podfile to force Swift 5 language mode on Expo JSI pods
        working-directory: ios
        run: |
          # Append a post_install hook that sets SWIFT_VERSION=5.0 and disables
          # strict concurrency for all ExpoModulesJSI-related targets.
          # This prevents Swift 6 Sendable/actor-isolation errors from Xcode 26.
          cat >> Podfile <<'PATCH'

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              if target.name.include?('ExpoModulesJSI') ||
                 target.name.include?('expo-modules-jsi') ||
                 target.name.include?('ExpoModulesCore')
                target.build_configurations.each do |config|
                  config.build_settings['SWIFT_VERSION'] = '5.0'
                  config.build_settings['SWIFT_STRICT_CONCURRENCY'] = 'minimal'
                  config.build_settings['OTHER_SWIFT_FLAGS'] ||= '$(inherited)'
                  config.build_settings['OTHER_SWIFT_FLAGS'] += ' -swift-version 5'
                end
              end
            end
          end
          PATCH
          echo "--- Podfile tail ---"
          tail -20 Podfile

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build Unsigned Release App
        working-directory: ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          export NODE_BINARY=$(which node)
          if ! xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" > xcodebuild.log 2>&1; then
            echo "=== XCODEBUILD ERROR DETAILS ==="
            grep -E "error:|fatal error:|Command PhaseScriptExecution failed" -B 10 -A 5 xcodebuild.log | tail -n 80
            exit 1
          fi

      - name: Package Unsigned IPA
        working-directory: ios
        run: |
          rm -rf Payload Musify-unsigned.ipa
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: Valid .app bundle with Info.plist not found!"
            find build -maxdepth 4 || true
            exit 1
          fi
          cp -R "$APP_PATH" Payload/
          zip -qry Musify-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Musify-iOS-IPA
          path: ios/Musify-unsigned.ipa