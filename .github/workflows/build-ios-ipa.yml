name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Expo Prebuild (iOS)
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build Unsigned Release App
        working-directory: ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          export NODE_BINARY=$(which node)
          if ! xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Musify.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" > xcodebuild.log 2>&1; then
            echo "=== XCODEBUILD FAILED - LAST 80 LINES ==="
            tail -n 80 xcodebuild.log
            exit 1
          fi

      - name: Package Unsigned IPA
        working-directory: ios
        run: |
          rm -rf Payload Musify-unsigned.ipa
          mkdir -p Payload
          APP_PATH=$(find build/Musify.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: Valid .app bundle with Info.plist not found in archive!"
            find build -maxdepth 4 || true
            exit 1
          fi
          cp -R "$APP_PATH" Payload/
          zip -qry Musify-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Musify-iOS-IPA
          path: ios/Musify-unsigned.ipa