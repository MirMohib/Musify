name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Expo Prebuild (iOS)
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build Unsigned Release App
        working-directory: ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee xcodebuild.log || (echo "=== XCODEBUILD ERRORS ===" && grep -E "error:|fatal error:" xcodebuild.log | tail -n 30 && exit 1)

      - name: Package Unsigned IPA
        working-directory: ios
        run: |
          rm -rf Payload Musify-unsigned.ipa
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: Valid .app bundle with Info.plist not found!"
            exit 1
          fi
          cp -R "$APP_PATH" Payload/
          zip -qry Musify-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Musify-iOS-IPA
          path: ios/Musify-unsigned.ipa